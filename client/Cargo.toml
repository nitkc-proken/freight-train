[package]
name = "client"
version = "0.1.0"
edition = "2021"
[[bin]]
name = "fr8"
path = "src/main.rs"
[dependencies]
clap = { version = "4.5.26", features = ["derive"] }
common = { path = "../common" }
openapi = { path = "../backend_api" }
confy = "0.6.1"
dialoguer = "0.11.0"
reqwest = { version = "0.12.12", features = ["json"] }
rpassword = "7.3.1"
serde = "1.0.217"
serde_json = "1.0.137"
tokio = { version = "1.43.0", features = ["full"] }
tokio-util = {version = "0.7.13", features = ["io-util"]}
tokio-stream = "0.1.17"
url = { version = "2.5.4", features = ["serde"] }
cidr = "0.3.1"
uuid = { version = "1.12.0", features = ["serde"] }

async-trait = "0.1.84"
futures = "0.3.31"
packet = { version = "0.1.4" }
quinn = "0.11"
rustls = { version = "0.23.20",default-features = false,features = ["logging","std",] }

tun = {version = "0.7.10",features = ["async"]}