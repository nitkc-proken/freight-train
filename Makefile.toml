env_files = [{ path = ".env.example"}]
# Load .env file if it exists
env_scripts = ['''
#!@duckscript
if is_file .env
    text = readfile .env
    handle = map
    map_load_properties ${handle} ${text}
    set_env --handle ${handle}
end
''']


[config]
default_to_workspace = false

[tasks.openapi-fetch]
description = "Fetch latest OpenAPI schema"
command = "curl"
args = ["-o", "schema.yaml", "${BACKEND_REST_HOST}/api/schema.yaml"]

[tasks.openapi-gen]
description = "Generate Rust client from OpenAPI schema"
command = "docker"
windows.env = { "PWD" = { script = ["cd"] } }
linux.env = { "UID" = { script = [
    "id -u",
] }, "GID" = { script = [
    "id -g",
] }, "OPTS" = "--user=${UID}:${GID}" }

args = [
    "run",
    "--rm",
    "@@remove-empty(OPTS)",
    "-v",
    "${PWD}:/local",
    "openapitools/openapi-generator-cli",
    "generate",
    "-i",
    "/local/schema.yaml",
    "-g",
    "rust",
    "-o",
    "/local/backend_api",
    "--skip-validate-spec",
]

[tasks.openapi]
description = "Fetch and generate OpenAPI schema"
dependencies = ["openapi-fetch", "openapi-gen"]
